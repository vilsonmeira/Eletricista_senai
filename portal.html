<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101c33"><title>Acompanhar projeto | Eletricista SENAI</title><style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#142139;--line:#2a3c5c;--blue:#60a5fa;--yellow:#facc15;--muted:#a8b6cc}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1a3152,var(--bg) 58%);font:15px/1.5 system-ui,Arial;color:#f8fafc}
header{padding:22px 16px;text-align:center;background:#0c1729;border-bottom:1px solid var(--line)}h1{margin:5px 0;font-size:clamp(24px,5vw,36px)}header p,.muted,small{color:var(--muted)}
main{max-width:1050px;margin:auto;padding:15px;display:grid;gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}label{display:grid;gap:5px;color:#dbeafe}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#0b1729;color:white;font:inherit}textarea{min-height:100px;resize:vertical}
button,.btn{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#1d3150;color:white;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
button.primary,.btn.primary{background:#1d4ed8;border-color:#3b82f6}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.status{padding:12px;border:1px solid var(--line);border-radius:10px;background:#0b1729;margin-top:12px;white-space:pre-wrap}.good{color:#fde68a;border-color:#a16207}.bad{color:#fecdd3;border-color:#be123c}
.row{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.pill{border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:#dbeafe}
.item{padding:13px;border:1px solid var(--line);border-radius:12px;margin-top:10px;background:#0b1729}.item h3{margin:0 0 5px}.bar{height:9px;border-radius:9px;background:#26364f;overflow:hidden}.bar span{display:block;height:100%;background:#60a5fa}
a{color:#93c5fd}@media(max-width:600px){main{padding:10px}.card{padding:13px}}
@media print{body{background:#fff;color:#111}header{background:#fff;color:#111}.card,.item{background:#fff;color:#111;border:1px solid #aaa}.muted,small{color:#444}.no-print,button{display:none!important}}
</style></head><body>
<header><div style="font-size:34px">📐⚡</div><h1>ACOMPANHAMENTO DO PROJETO</h1><p>Veja as atualizações do seu projeto residencial.</p></header>
<main><section class="card" id="main"><p class="muted">Carregando seu projeto...</p></section><section class="card"><h2>Histórico de atualizações</h2><div id="updates" class="muted">Aguardando informações...</div></section><div class="actions no-print"><a class="btn" href="./index.html">Voltar ao início</a><button onclick="loadProject()">Atualizar agora</button><button onclick="window.print()">Imprimir / salvar em PDF</button></div></main>
<script>
const API="https://pzkwxlxhawrbnjbsdxpo.supabase.co/functions/v1/eletricista-portal";const token=new URLSearchParams(location.search).get("token");let lastData=null;
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
const labels={solicitado:"Solicitação recebida",em_levantamento:"Levantamento",em_desenvolvimento:"Projeto em desenvolvimento",em_revisao:"Em revisão",concluido:"Concluído",entregue:"Entregue"};
function planMarkup(data){
 const rooms=Array.isArray(data)?data:(Array.isArray(data?.rooms)?data.rooms:null);
 if(!rooms||!rooms.length)return '<pre style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(JSON.stringify(data,null,2))+'</pre>';
 const scale=55,gap=38,pad=24;let x=pad,y=pad,rowH=0,maxY=pad;let body='';
 rooms.forEach((r,i)=>{const w=Math.max(70,Number(r.l||3)*scale),h=Math.max(60,Number(r.w||2.5)*scale);if(x+w>850){x=pad;y+=rowH+gap;rowH=0}
 body+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="#eef4fb" stroke="#1e3a5f" stroke-width="4"/><text x="'+(x+w/2)+'" y="'+(y+22)+'" text-anchor="middle" font-size="15" fill="#142139">'+esc(r.name||('Cômodo '+(i+1)))+'</text>';
 (r.points||[]).forEach(p=>{const px=x+Math.max(0,Math.min(1,Number(p.x)||0))*w,py=y+Math.max(0,Math.min(1,Number(p.y)||0))*h;const sym={light:'L',switch:'I',outlet:'T',special:'E',door:'P',window:'J'}[p.type]||'•';body+='<circle cx="'+px+'" cy="'+py+'" r="10" fill="#facc15" stroke="#142139" stroke-width="1.5"/><text x="'+px+'" y="'+(py+4)+'" text-anchor="middle" font-size="10" font-weight="bold" fill="#142139">'+sym+'</text>'});
 body+='<text x="'+(x+w/2)+'" y="'+(y+h-8)+'" text-anchor="middle" font-size="12" fill="#1e3a5f">'+Number(r.l||0)+' m × '+Number(r.w||0)+' m</text>';
 x+=w+gap;rowH=Math.max(rowH,h);maxY=Math.max(maxY,y+h+pad);
 });
 return '<div style="overflow:auto;background:#fff;border-radius:10px;padding:8px"><svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 '+(maxY+10)+'">'+body+'</svg></div><p class="muted">Símbolos: L = luz, I = interruptor, T = tomada, E = tomada específica, P = porta, J = janela.</p>';
}
async function loadProject(){if(!token){document.getElementById("main").textContent="Link de acompanhamento inválido.";return;}
try{const r=await fetch(API+"?token="+encodeURIComponent(token),{cache:"no-store",headers:{"apikey":"sb_publishable_BcTki-0Wb62BvddGw68cow_dqJvY_8o"}});const d=await r.json();if(!r.ok)throw new Error(d.error||"Projeto não encontrado.");lastData=d;const p=d.project,prop=p.property||{};
document.getElementById("main").innerHTML='<div class="row"><h2>'+esc(p.title)+'</h2><span class="pill">'+esc(labels[p.status]||p.status)+'</span></div><p><b>Cliente:</b> '+esc(prop.customer_name)+'<br><b>Imóvel:</b> '+esc(prop.property_name)+'<br><b>Endereço:</b> '+esc(prop.address)+'</p><div class="row"><b>Andamento</b><b>'+Number(p.progress||0)+'%</b></div><div class="bar"><span style="width:'+Math.max(0,Math.min(100,Number(p.progress||0)))+'%"></span></div><p class="muted">Última atualização: '+new Date(p.updated_at).toLocaleString("pt-BR")+'</p>'+(p.client_notes?'<p>'+esc(p.client_notes)+'</p>':'')+(p.pdf_url?'<p><a class="btn primary" href="'+esc(p.pdf_url)+'" target="_blank" rel="noopener">Abrir PDF do projeto</a></p>':'')+(p.plan_data&&Object.keys(p.plan_data).length?'<div class="item"><h3>Planta e resumo técnico</h3>'+planMarkup(p.plan_data)+'<button class="no-print" onclick="window.print()">Salvar projeto em PDF</button></div>':'<p class="muted">O arquivo do projeto será disponibilizado aqui quando a etapa de elaboração for concluída.</p>');
document.getElementById("updates").innerHTML=(d.updates||[]).length?d.updates.map(u=>'<article class="item"><div class="row"><b>'+esc(u.title)+'</b><small>'+new Date(u.created_at).toLocaleString("pt-BR")+'</small></div><p>'+esc(u.description)+'</p>'+(u.progress!=null?'<small>Andamento informado: '+u.progress+'%</small>':'')+'</article>').join(""):'Ainda não há atualizações publicadas.';
}catch(e){document.getElementById("main").textContent=e.message;}}
loadProject();setInterval(loadProject,10000);
</script></body></html>
