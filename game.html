<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#071a35">
<title>VM Elétrica Game — Simulador Profissional</title>
<style>
:root{color-scheme:dark;font-family:system-ui,Arial,sans-serif;background:#071426;color:#f8fafc}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
#game{position:fixed;inset:0;background:linear-gradient(#8fc7e9,#d7e9ef);touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
.panel{pointer-events:auto;background:#071a35eF;border:1px solid #7da6ce;border-radius:14px;padding:10px 12px;box-shadow:0 5px 18px #00152b55;backdrop-filter:blur(8px)}
.topline{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{font-weight:1000;color:#ffcf36;letter-spacing:.5px}.stat{font-size:12px;color:#dbeafe}
#objective{max-width:660px;margin-top:8px;font-size:13px;line-height:1.35}
#progress{height:7px;border-radius:8px;background:#344a64;margin-top:8px;overflow:hidden}
#bar{height:100%;width:0;background:#ffc928;transition:width .2s}
.bottom{display:flex;justify-content:space-between;align-items:end;gap:10px}
#joystick{width:132px;height:132px;position:relative;pointer-events:auto;touch-action:none;border-radius:50%;background:#071a3577;border:2px solid #d9e8fa99;box-shadow:inset 0 0 0 8px #ffffff12}
#stick{position:absolute;width:52px;height:52px;left:38px;top:38px;border-radius:50%;background:linear-gradient(#fff,#9db6d2);border:3px solid #17375e;box-shadow:0 4px 8px #0008}
.actions{display:grid;grid-template-columns:repeat(2,minmax(74px,1fr));gap:8px;pointer-events:auto}
button{border:2px solid #061a35;border-radius:13px;background:linear-gradient(#ffdf63,#f5ad00);color:#10294a;font-weight:1000;padding:12px 10px;min-height:48px;box-shadow:0 4px 0 #061a35;touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #061a35}
button.secondary{background:linear-gradient(#eaf4ff,#a9c9e9);color:#10294a}
#interact{grid-column:1/-1;min-height:56px;background:linear-gradient(#ffeb8b,#ffc21a);font-size:15px}
#message{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,440px);background:#071a35f5;border:2px solid #ffc928;border-radius:16px;padding:18px;text-align:center;box-shadow:0 12px 40px #0009;z-index:5;display:none}
#message h2{margin:0 0 8px;color:#ffcf36}#message p{font-size:14px;line-height:1.45;color:#e6f0ff}
#message button{margin-top:8px;min-width:130px}
#hint{position:fixed;left:50%;bottom:158px;transform:translateX(-50%);background:#071a35dd;border:1px solid #8fb4da;border-radius:20px;padding:7px 12px;font-size:12px;text-align:center;max-width:80vw;pointer-events:none}
#back{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top));pointer-events:auto;text-decoration:none;color:#fff;background:#071a35dd;border:1px solid #7da6ce;border-radius:10px;padding:8px 11px;font-size:12px}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#071a35;color:white;z-index:10;text-align:center;padding:24px}
@media(min-width:760px){#joystick{width:150px;height:150px}#stick{left:45px;top:45px}.actions{grid-template-columns:repeat(2,100px)}#hint{bottom:178px}}
@media(max-height:540px){#joystick{width:100px;height:100px}#stick{width:42px;height:42px;left:27px;top:27px}.actions button{min-height:40px;padding:8px}#hint{bottom:112px}#objective{max-width:70vw}}
</style>
</head>
<body>
<div id="game"></div>
<div id="loading"><div><div style="font-size:44px">⚡</div><h2>Carregando VM Elétrica Game</h2><p>Preparando sua oficina 3D...</p></div></div>
<a id="back" href="./index.html">← VM Elétrica</a>
<div id="hud">
 <section class="panel">
  <div class="topline"><span class="brand">⚡ VM ELÉTRICA GAME</span><span id="stage" class="stat">FASE 1 / 3</span><span id="score" class="stat">⭐ 0 XP</span></div>
  <div id="objective">Objetivo: pegue sua maleta de ferramentas.</div>
  <div id="progress"><div id="bar"></div></div>
 </section>
 <div class="bottom">
  <div id="joystick" aria-label="Joystick de movimento"><div id="stick"></div></div>
  <div class="actions">
   <button class="secondary" id="turnLeft">↶ CÂMERA</button>
   <button class="secondary" id="turnRight">CÂMERA ↷</button>
   <button id="interact">INTERAGIR</button>
  </div>
 </div>
</div>
<div id="hint">Use o joystick para andar. Gire a câmera para explorar.</div>
<div id="message"><h2 id="msgTitle">Missão</h2><p id="msgText"></p><button id="msgButton">Continuar</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const root=document.getElementById('game');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc8e1);scene.fog=new THREE.Fog(0x9bc8e1,18,34);
const camera=new THREE.OrthographicCamera(-8,8,6,-6,.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe8f6ff,0x6a573c,2.0));
const sun=new THREE.DirectionalLight(0xfff0d2,2.2);sun.position.set(-6,12,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(color,roughness=.8)=>new THREE.MeshStandardMaterial({color,roughness});
const floorMat=mat(0xd8d0bd),wallMat=mat(0xf1e8d4),blue=mat(0x14528a),yellow=mat(0xffc928),dark=mat(0x20344a),wood=mat(0x9b7045),metal=mat(0x8d9aa8,.45),white=mat(0xfaf7ef);
function box(parent,x,y,z,w,h,d,material,cast=true){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;parent.add(m);return m}
const ground=box(scene,0,-.18,0,18,.3,15,floorMat,false);
for(let x=-8;x<=8;x+=2)for(let z=-6;z<=6;z+=2){const tile=new THREE.Mesh(new THREE.BoxGeometry(1.96,.012,1.96),mat((Math.abs(x/2+z/2)%2===0)?0xe7dfce:0xd9d0be));tile.position.set(x,-.015,z);scene.add(tile)}
// Casa aberta em estilo maquete: paredes baixas permitem enxergar o interior.
box(scene,0,1.35,-7.25,18,2.7,.35,wallMat);box(scene,-8.85,1.35,0,.35,2.7,14.5,wallMat);box(scene,8.85,1.35,0,.35,2.7,14.5,wallMat);
box(scene,-4,1.35,7.25,10,2.7,.35,wallMat);box(scene,7,1.35,7.25,3.7,2.7,.35,wallMat);
box(scene,-1,1.25,-2.4,.18,2.5,5,wallMat);box(scene,3.6,1.25,1.4,7.5,2.5,.18,wallMat);
function label(text,x,y,z,color='#163451'){const c=document.createElement('canvas');c.width=512;c.height=128;const ctx=c.getContext('2d');ctx.fillStyle='rgba(255,255,255,.88)';ctx.fillRect(4,4,504,120);ctx.strokeStyle='#17365b';ctx.lineWidth=8;ctx.strokeRect(4,4,504,120);ctx.fillStyle=color;ctx.font='bold 42px Arial';ctx.textAlign='center';ctx.fillText(text,256,82);const tex=new THREE.CanvasTexture(c);const mesh=new THREE.Mesh(new THREE.PlaneGeometry(2.8,.7),new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide}));mesh.position.set(x,y,z);mesh.rotation.x=-Math.PI/2;scene.add(mesh);return mesh}
function marker(x,z,color=0xffc928){const g=new THREE.Mesh(new THREE.CylinderGeometry(.52,.52,.06,32),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.45}));g.position.set(x,.05,z);scene.add(g);const ring=new THREE.Mesh(new THREE.TorusGeometry(.55,.055,8,32),new THREE.MeshBasicMaterial({color}));ring.rotation.x=Math.PI/2;ring.position.set(x,.1,z);scene.add(ring);return g}
const toolbox=new THREE.Group();toolbox.position.set(-6,0,-4);scene.add(toolbox);box(toolbox,0,.35,0,1.4,.7,.9,blue);box(toolbox,0,.77,0,1.5,.16,1,yellow);box(toolbox,0,.9,0,.42,.1,.12,metal);label('MALETA DE FERRAMENTAS',-5.6,.025,-3.1);
const cable=new THREE.Group();cable.position.set(-5,0,1);scene.add(cable);const coil=new THREE.Mesh(new THREE.TorusGeometry(.42,.12,10,28),mat(0x24364c));coil.rotation.x=Math.PI/2;cable.add(coil);const coil2=coil.clone();coil2.position.y=.18;cable.add(coil2);label('CABO DIDÁTICO',-4.8,.025,2);
const socket=new THREE.Group();socket.position.set(6,.85,-4.5);scene.add(socket);box(socket,0,0,0,.65,.72,.14,white);const holeMat=mat(0x172638);for(const z of [-.14,.14]){const h=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,.025,16),holeMat);h.rotation.x=Math.PI/2;h.position.set(0,z,.09);socket.add(h)}label('PONTO DE TOMADA',5.4,.025,-3.4);
const switchObj=new THREE.Group();switchObj.position.set(4,.9,3.9);scene.add(switchObj);box(switchObj,0,0,0,.58,.78,.14,white);const keyMesh=box(switchObj,0,0,.1,.25,.38,.08,mat(0xd5dbe2));label('INTERRUPTOR',4.8,.025,5);
const lamp=new THREE.Group();lamp.position.set(1,2.35,-.2);scene.add(lamp);box(lamp,0,0,0,.65,.12,.65,metal);const bulb=new THREE.Mesh(new THREE.SphereGeometry(.22,18,12),mat(0x5b6570));bulb.position.y=-.28;lamp.add(bulb);const glow=new THREE.PointLight(0xffd35c,0,5);glow.position.copy(lamp.position);scene.add(glow);label('LUMINÁRIA',1.8,.025,.8);
const workbench=new THREE.Group();workbench.position.set(-5,0,4.4);scene.add(workbench);box(workbench,0,.95,0,2,.18,1,wood);for(const x of [-.8,.8])for(const z of [-.35,.35])box(workbench,x,.45,z,.12,.9,.12,wood);
const player=new THREE.Group();scene.add(player);player.position.set(-2,0,5.2);
const body=box(player,0,.95,0,.55,.85,.35,blue);const head=new THREE.Mesh(new THREE.SphereGeometry(.24,18,14),mat(0xc98d65));head.position.set(0,1.58,0);player.add(head);const helmet=new THREE.Mesh(new THREE.SphereGeometry(.27,18,10,0,Math.PI*2,0,Math.PI/2),yellow);helmet.position.set(0,1.76,0);player.add(helmet);box(player,0,1.52,.22,.18,.08,.04,dark,false);
for(const x of [-.19,.19]){box(player,x,.32,0,.17,.5,.19,dark);box(player,x,.08,.08,.22,.13,.34,mat(0x202a36))}
const arms=[];for(const x of [-.38,.38]){const a=box(player,x,1.03,0,.16,.62,.17,mat(0xc98d65));arms.push(a)}
const playerMarker=marker(-2,5.2,0x36a3ff);playerMarker.scale.set(.7,.7,.7);
const interactables=[{name:'maleta',obj:toolbox,x:-6,z:-4},{name:'cabo',obj:cable,x:-5,z:1},{name:'tomada',obj:socket,x:6,z:-4.5},{name:'interruptor',obj:switchObj,x:4,z:3.9},{name:'luminaria',obj:lamp,x:1,z:-.2}];
let stage=0,xp=0,hasTools=false,hasCable=false,installedSocket=false,installedSwitch=false,lampOn=false,done=false;
const goals=[
 {text:'Pegue a maleta de ferramentas na bancada azul.',target:'maleta',action:'PEGAR MALETA'},
 {text:'Colete o cabo didático e leve-o até o ponto de tomada.',target:'cabo',action:'COLETAR CABO'},
 {text:'Aproxime-se do ponto e instale a tomada no painel.',target:'tomada',action:'INSTALAR TOMADA'},
 {text:'Vá até o interruptor e faça a instalação simulada.',target:'interruptor',action:'INSTALAR INTERRUPTOR'},
 {text:'Conclua a missão acionando o teste visual da luminária.',target:'luminaria',action:'TESTAR LUMINÁRIA'}
];
let goalIndex=0;let nearest=null;let cameraAngle=Math.PI/4;let joy={x:0,y:0,active:false,id:null};let last=performance.now();
const stageEl=document.getElementById('stage'),scoreEl=document.getElementById('score'),objective=document.getElementById('objective'),bar=document.getElementById('bar'),actionBtn=document.getElementById('interact'),hint=document.getElementById('hint');
function updateHud(){stageEl.textContent='FASE '+(stage+1)+' / 3';scoreEl.textContent='⭐ '+xp+' XP';objective.textContent='Objetivo: '+(goals[goalIndex]?.text||'Missão concluída!');bar.style.width=(goalIndex/goals.length*100)+'%';actionBtn.textContent=goals[goalIndex]?.action||'FASE CONCLUÍDA';}
function showMessage(title,text,button='Continuar',callback){document.getElementById('msgTitle').textContent=title;document.getElementById('msgText').textContent=text;const el=document.getElementById('message');el.style.display='block';const b=document.getElementById('msgButton');b.textContent=button;b.onclick=()=>{el.style.display='none';if(callback)callback()}}
function completeGoal(){xp+=100;goalIndex++;updateHud();hint.textContent='Muito bem! +100 XP';if(goalIndex>=goals.length){bar.style.width='100%';done=true;showMessage('FASE CONCLUÍDA!','Você concluiu a primeira missão de reconhecimento e instalação simulada. Ganhou 500 XP. Próxima etapa: novos ambientes e desafios.','RECOMEÇAR',()=>{stage=(stage+1)%3;resetStage()});}else{showMessage('Objetivo concluído!','Você ganhou 100 XP. Continue seguindo as instruções da missão.');}}
function resetStage(){goalIndex=0;hasTools=false;hasCable=false;installedSocket=false;installedSwitch=false;lampOn=false;done=false;player.position.set(-2,0,5.2);bulb.material=mat(0x5b6570);glow.intensity=0;updateHud();showMessage('FASE '+(stage+1),'Nova missão carregada. Explore o ambiente usando o joystick.');}
function distanceTo(item){return Math.hypot(player.position.x-item.x,player.position.z-item.z)}
function nearestItem(){let best=null,dist=99;for(const item of interactables){const d=distanceTo(item);if(d<dist){best=item;dist=d}}return dist<2.0?best:null}
function interact(){if(done)return;nearest=nearestItem();const target=goals[goalIndex]?.target;if(!nearest){hint.textContent='Chegue mais perto do objeto indicado.';return}if(nearest.name!==target){hint.textContent='Esse objeto não faz parte do objetivo atual. Siga o marcador amarelo.';return}
if(target==='maleta'){hasTools=true;toolbox.visible=false;completeGoal();return}
if(target==='cabo'){if(!hasTools){hint.textContent='Primeiro pegue a maleta de ferramentas.';return}hasCable=true;cable.visible=false;completeGoal();return}
if(target==='tomada'){if(!hasCable){hint.textContent='Colete o cabo didático antes de instalar.';return}installedSocket=true;socket.scale.set(1.12,1.12,1.12);socket.children[0].material=mat(0xb8e5c8);completeGoal();return}
if(target==='interruptor'){installedSwitch=true;keyMesh.material=mat(0x39a96b);completeGoal();return}
if(target==='luminaria'){if(!installedSocket||!installedSwitch){hint.textContent='Conclua os pontos anteriores primeiro.';return}lampOn=true;bulb.material=mat(0xffdc62);glow.intensity=2.2;completeGoal();}}
actionBtn.addEventListener('click',interact);
function rotateCamera(dir){cameraAngle+=dir*Math.PI/4}
document.getElementById('turnLeft').addEventListener('click',()=>rotateCamera(-1));document.getElementById('turnRight').addEventListener('click',()=>rotateCamera(1));
const joyEl=document.getElementById('joystick'),stick=document.getElementById('stick');
function joyMove(e){if(!joy.active||e.pointerId!==joy.id)return;const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=r.width*.31;const len=Math.hypot(dx,dy);if(len>max){dx=dx/len*max;dy=dy/len*max}joy.x=dx/max;joy.y=dy/max;stick.style.transform='translate('+dx+'px,'+dy+'px)'}
joyEl.addEventListener('pointerdown',e=>{joy.active=true;joy.id=e.pointerId;joyEl.setPointerCapture(e.pointerId);joyMove(e)});joyEl.addEventListener('pointermove',joyMove);function joyEnd(e){if(e.pointerId!==joy.id)return;joy.active=false;joy.x=0;joy.y=0;stick.style.transform='translate(0,0)'}joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '){e.preventDefault();interact()}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function update(dt){let ix=joy.x,iz=joy.y;if(keys.w||keys.arrowup)iz-=1;if(keys.s||keys.arrowdown)iz+=1;if(keys.a||keys.arrowleft)ix-=1;if(keys.d||keys.arrowright)ix+=1;const len=Math.hypot(ix,iz);if(len>1){ix/=len;iz/=len}
const ca=Math.cos(cameraAngle),sa=Math.sin(cameraAngle);const wx=(ix*ca+iz*sa),wz=(-ix*sa+iz*ca);const speed=3.1;
if(len>.08){player.position.x+=wx*speed*dt;player.position.z+=wz*speed*dt;player.rotation.y=Math.atan2(wx,wz);arms[0].rotation.x=Math.sin(performance.now()*.012)*.25;arms[1].rotation.x=-arms[0].rotation.x}
player.position.x=THREE.MathUtils.clamp(player.position.x,-7.5,7.5);player.position.z=THREE.MathUtils.clamp(player.position.z,-6,6);
playerMarker.position.set(player.position.x,.06,player.position.z);
nearest=nearestItem();const target=goals[goalIndex]?.target;const targetItem=interactables.find(i=>i.name===target);for(const i of interactables){const obj=i.obj;obj.traverse(o=>{if(o.isMesh&&o.material&&o.material.emissive){o.material.emissive.setHex(i===targetItem?0x493500:0x000000)}})}
if(nearest&&nearest.name===target){hint.textContent='Perto de '+nearest.name+'. Toque em '+(goals[goalIndex]?.action||'INTERAGIR')+'.'}else if(!joy.active){hint.textContent='Use o joystick para andar e os botões para girar a câmera.'}
camera.position.set(player.position.x+Math.sin(cameraAngle)*12,12,player.position.z+Math.cos(cameraAngle)*12);camera.lookAt(player.position.x,0,player.position.z);
}
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.04);last=now;update(dt);renderer.render(scene,camera)}
function resize(){renderer.setSize(innerWidth,innerHeight);const aspect=innerWidth/innerHeight;const h=6.4;camera.left=-h*aspect;camera.right=h*aspect;camera.top=h;camera.bottom=-h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();updateHud();requestAnimationFrame(animate);document.getElementById('loading').style.display='none';
showMessage('BEM-VINDO AO VM ELÉTRICA GAME','Você é o eletricista da equipe. Use o joystick à esquerda para caminhar. Os botões à direita giram a câmera e executam ações. Este é um treinamento virtual: não representa procedimento para instalação real.','COMEÇAR');
</script>
</body>
</html>
